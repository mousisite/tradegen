<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>No connection · Orenth</title>
<!-- Shown by the app itself, from inside the app, whenever orenth.app cannot
     be reached. It must work with no connection at all, so everything is in
     this one file: no fonts, pictures or scripts are fetched. The colours are
     the site's own, light and dark. -->
<style>
  :root {
    color-scheme: light;
    --paper: #f4f3ee;
    --surface: #faf9f5;
    --ink: #191817;
    --ink-2: #5a554e;
    --accent: #c96442;
    --accent-btn: #bc5736;
    --rule: #d8d3c8;
    --focus: #aa4f30;
    --serif: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #191817;
      --surface: #22201e;
      --ink: #f4f3ee;
      --ink-2: #a8a199;
      --accent: #e89268;
      --accent-btn: #bc5736;
      --rule: #3a3733;
      --focus: #e89268;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 17px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { max-width: 22rem; }
  .mark { color: var(--ink); margin: 0 auto 20px; width: 56px; height: 56px; }
  .mark .lit { fill: var(--accent); }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 12px;
  }
  p { margin: 0 0 28px; color: var(--ink-2); }
  button {
    font: 600 17px/1 var(--sans);
    color: #fff;
    background: var(--accent-btn);
    border: 0;
    border-radius: 8px;
    padding: 15px 28px;
    min-width: 12rem;
    min-height: 48px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { filter: brightness(0.92); }
  button:disabled { opacity: 0.7; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
    <circle cx="500" cy="500" r="361" fill="none" stroke="currentColor" stroke-width="78"/>
    <rect x="289.8" y="537.6" width="119.6" height="155.1" rx="16" fill="currentColor"/>
    <rect x="440.2" y="410.7" width="119.6" height="202.1" rx="16" fill="currentColor"/>
    <rect class="lit" x="590.6" y="307.3" width="119.6" height="202.1" rx="16"/>
  </svg>
  <h1>No connection</h1>
  <p>Orenth needs the internet to fetch prices. Check that Wi-Fi or mobile
    data is on, then try again.</p>
  <button type="button" id="again">Try again</button>
</main>
<script>
  (function () {
    var HOME = 'https://orenth.app/';
    var button = document.getElementById('again');
    // Where trying again goes: the page that could not be opened, once the
    // app has said which it was, or else the front page.
    var again = HOME;

    // Only ever a page of orenth.app itself.
    function onSite(address) {
      var u;
      try { u = new URL(address); } catch (e) { return false; }
      return u.protocol === 'https:' && u.host === 'orenth.app';
    }

    function retry() {
      button.disabled = true;
      button.textContent = 'Trying…';
      // In place of this page, so going back later does not land on it.
      window.location.replace(again);
    }
    button.addEventListener('click', retry);
    // Back by itself the moment the phone says it is online again.
    window.addEventListener('online', retry);

    // Inside the app: take away the launch screen, which could otherwise sit
    // on top of this page, match the status bar to it, and ask which page
    // could not be opened (the app remembers the last one it set out to open).
    var C = window.Capacitor;
    if (C && typeof C.nativePromise === 'function' &&
        typeof C.isPluginAvailable === 'function') {
      var dark = !!(window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches);
      var quiet = function () {};
      if (C.isPluginAvailable('SplashScreen')) {
        C.nativePromise('SplashScreen', 'hide', {}).catch(quiet);
      }
      if (C.isPluginAvailable('StatusBar')) {
        C.nativePromise('StatusBar', 'setStyle', { style: dark ? 'DARK' : 'LIGHT' }).catch(quiet);
        C.nativePromise('StatusBar', 'setBackgroundColor',
                        { color: dark ? '#191817' : '#f4f3ee' }).catch(quiet);
      }
      if (C.isPluginAvailable('NavigationGuard')) {
        C.nativePromise('NavigationGuard', 'lastPage', {}).then(function (r) {
          if (r && onSite(r.url)) { again = r.url; }
        }).catch(quiet);
      }
    }
  })();
</script>
</body>
</html>
