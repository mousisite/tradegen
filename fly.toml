# Fly.io deployment. Equivalent to render.yaml; use whichever host you prefer.
app = "stockbot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  STOCKBOT_DB = "/data/stockbot.db"
  STOCKBOT_CONFIG = "/data/config.json"
  STOCKBOT_BEHIND_PROXY = "1"

# Secrets are set with `fly secrets set`, never in this file.

[[mounts]]
  source = "stockbot_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false     # stopping would stop alert checking too
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
